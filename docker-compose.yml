# Reference production topology (container checklist): Postgres,
# the FastAPI server, and an nginx edge that serves the static client bundle
# same-origin and terminates TLS. Not battle-tested against a live cluster in
# this session (no Docker daemon available here) - review before relying on
# it verbatim; see deploy/nginx.conf's note on OpenSSL/hybrid-KEM support.
#
# Secrets (DB password, etc.) come from a local .env file - never bake them
# into an image or commit them. Copy .env.example to .env and fill it in.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: meridian_edge
      POSTGRES_USER: meridian_edge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meridian_edge -d meridian_edge"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      MERIDIAN_EDGE_ENV: production
      MERIDIAN_EDGE_DATABASE_URL: postgresql+psycopg://meridian_edge:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/meridian_edge
      MERIDIAN_EDGE_WS_ORIGINS: ${MERIDIAN_EDGE_WS_ORIGINS:?set MERIDIAN_EDGE_WS_ORIGINS in .env, e.g. https://meridian-edge.example}
    read_only: true
    tmpfs:
      - /tmp

  proxy:
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ${TLS_CERT_DIR:?set TLS_CERT_DIR in .env, e.g. ./tls}:/etc/nginx/tls:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run

volumes:
  db-data:
