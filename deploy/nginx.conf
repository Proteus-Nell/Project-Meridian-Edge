# Reverse proxy reference config (CLAUDE.md §5 hardening checklist).
#
# Listens on 8080/8443 (non-privileged ports so the container can run as a
# non-root user with no added capabilities); docker-compose.yml maps the
# host's 80/443 onto them.
#
# TLS certificates are NOT baked into the image - mount them read-only at
# /etc/nginx/tls/{fullchain,privkey}.pem (e.g. from certbot or your CA of
# choice). This file only configures the TLS *policy*, not certificate
# provisioning.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Default temp paths live under /var/cache/nginx, made writable for the
    # non-root user in proxy.Dockerfile and mounted as tmpfs in
    # docker-compose.yml so it works under read_only: true.

    server {
        listen 8080;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        # TLS 1.3 only, hybrid PQ group first (CLAUDE.md §5). Requires an
        # OpenSSL build with ML-KEM support - see proxy.Dockerfile's note.
        ssl_protocols TLSv1.3;
        ssl_ecdh_curve X25519MLKEM768:X25519:secp384r1;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        client_max_body_size 64k; # matches MAX_PAYLOAD_BYTES (§3/§5), belt+suspenders

        # API + WS: opaque proxy to the backend. The backend's own uniform
        # error/security headers pass through as-is; only HSTS is deduplicated
        # since this edge already sets the authoritative copy.
        location /v1/ws {
            proxy_pass http://server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Origin $http_origin;
            proxy_hide_header Strict-Transport-Security;
        }

        location /v1/ {
            proxy_pass http://server:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Strict-Transport-Security;
        }

        # Static client bundle - the full page-level CSP (CLAUDE.md §5 exact
        # string) lives here; the API's own CSP (headers.py) is a stricter
        # deny-all baseline for JSON responses, not this one.
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://$host; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Cross-Origin-Opener-Policy same-origin always;
            add_header Cross-Origin-Resource-Policy same-origin always;
            add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
        }
    }
}
