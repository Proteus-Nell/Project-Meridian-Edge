<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The reverse proxy sets the production CSP; never add inline script or
         style to this file. This file holds structural elements and class names
         only: all behaviour lives in the bundled module. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <title>Meridian Edge - private post-quantum messenger</title>
    <meta
      name="description"
      content="A private messenger. Messages are encrypted on your device and can only be read by the person you send them to - not by the server. Post-quantum by design: ML-KEM-768 + ML-DSA-65."
    />

    <!-- Crawl yes, index no. A deployed instance holds one page and everything
         behind it needs a passphrase, so there is nothing to index; and a
         search-engine list of live instances is a target list rather than a
         feature. This is the half that search engines honour - public/robots.txt
         stays permissive on purpose so link unfurlers can still read the Open
         Graph tags below. See that file for why the two are split. -->
    <meta name="robots" content="noindex" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Link preview, for the case this app is actually shared in: someone
         pastes the URL into a chat app. Without these it unfurls as a bare URL.
         og.png is regenerated by scripts/make_og_image.py.

         The image path is relative because the deployed hostname is not known
         at build time (it is the operator's own domain, MERIDIAN_EDGE_DOMAIN).
         Slack, Discord, Signal, Telegram and iMessage all resolve a relative
         og:image against the page URL; Facebook's crawler is the notable one
         that wants it absolute, which is a trade this app can afford. og:url is
         omitted for the same reason - it has no meaningful relative form. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridian Edge" />
    <meta property="og:title" content="Meridian Edge" />
    <meta
      property="og:description"
      content="A private messenger. Messages are encrypted on your device and can only be read by the person you send them to - not by the server."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A globe drawn with meridian lines above the Meridian Edge wordmark."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- Without JavaScript the app is a blank screen: every terminal, every
         line of the banner and the whole app shell are written at runtime, and
         `body:not(.theme-ready) #app` keeps the shell hidden until the store has
         supplied a colour scheme - which never happens if the bundle never runs.
         So the failure mode is not a degraded page, it is nothing at all, and it
         looks identical whether scripting is off, an extension blocked the
         module, or the bundle 404'd. This says which it is.

         It is styled from style.css rather than an inline <style> (the CSP
         forbids one), which works because the built page loads its stylesheet
         with a plain <link>. In dev, Vite injects the CSS through JS instead, so
         with scripting off this block renders unstyled - readable, just plain. -->
    <noscript>
      <div id="noscript-notice">
        <p class="noscript-title">Meridian Edge needs JavaScript</p>
        <p>
          This is an end-to-end-encrypted messenger: the encryption runs in your
          browser, so with scripting turned off there is no app to show. Nothing
          is missing from the page - it has not started.
        </p>
        <p>
          Enable JavaScript for this site and reload. If it is already enabled,
          an extension or a network filter is most likely blocking the script
          bundle.
        </p>
      </div>
    </noscript>

    <!-- App shell: a scrolling transcript above a fixed footer that holds the
         status strip and the bottom-pinned command line. The autosuggest dropdown
         floats above the command line. Terminals mount into #transcript and
         #command-line at runtime; ticks are xterm decorations inside #transcript. -->
    <div id="app">
      <div id="transcript-pane">
        <!-- Background emblem medallion: decorative, spins around its vertical
             axis via CSS (rotateY + perspective). The markup is static and
             app-generated; untrusted content never touches it. States: paused
             when idle, slow spin while a session is live (body.is-playing),
             fast spin plus pulse ring while a security event or contact request
             awaits acknowledgement (body.is-tx). Toggled by
             /settings theme emblem. -->
        <!-- `hidden` keeps the raw SVG out of the very first paint: the UA
             stylesheet's [hidden]{display:none} applies before our style.css
             loads (in dev, Vite injects the CSS via JS a frame late), so the
             unstyled medallion can't flash at intrinsic size. Once the sheet
             loads, `body.th-emblem .medallion { display: block }` wins on
             specificity and shows it normally. CSP forbids an inline style. -->
        <div class="medallion" aria-hidden="true" hidden>
          <svg class="emblem-svg" viewBox="0 0 140 140">
            <!-- Shared framing: solid ring + dashed inner ring. The inner glyph
                 is selectable via /settings emblem (body.em-globe/em-tree). -->
            <circle cx="70" cy="70" r="64" fill="none" stroke="var(--emblem)" stroke-width="2.2"/>
            <circle cx="70" cy="70" r="57" fill="none" stroke="var(--emblem-dim)" stroke-width="1" stroke-dasharray="2 5"/>
            <g class="glyph glyph-globe" stroke="var(--emblem)" fill="none" stroke-width="2.2" stroke-linecap="round">
              <circle cx="70" cy="70" r="40"/>
              <ellipse cx="70" cy="70" rx="17" ry="40"/>
              <ellipse cx="70" cy="70" rx="31" ry="40"/>
              <path d="M30 70 L110 70"/>
              <path d="M34 52 Q70 42 106 52"/>
              <path d="M34 88 Q70 98 106 88"/>
            </g>
            <g class="glyph glyph-tree">
              <g stroke="var(--emblem)" stroke-width="3" fill="none" stroke-linecap="round">
                <path d="M70 104 L70 58"/>
                <path d="M70 78 Q56 70 50 56"/>
                <path d="M70 78 Q84 70 90 56"/>
                <path d="M70 90 Q60 86 55 76"/>
                <path d="M70 90 Q80 86 85 76"/>
              </g>
              <g fill="var(--emblem)">
                <circle cx="70" cy="40" r="7"/>
                <circle cx="56" cy="45" r="5.5"/>
                <circle cx="84" cy="45" r="5.5"/>
                <circle cx="47" cy="54" r="4.5"/>
                <circle cx="93" cy="54" r="4.5"/>
                <circle cx="61" cy="52" r="4"/>
                <circle cx="79" cy="52" r="4"/>
                <circle cx="52" cy="72" r="3"/>
                <circle cx="88" cy="72" r="3"/>
                <ellipse cx="70" cy="31" rx="3" ry="4.5"/>
              </g>
              <g stroke="var(--emblem)" fill="none" stroke-linecap="round">
                <path d="M48 104 Q70 114 92 104" stroke-width="2.2"/>
                <path d="M58 106 Q62 111 58 115" stroke-width="1.6"/>
                <path d="M82 106 Q78 111 82 115" stroke-width="1.6"/>
                <path d="M70 106 L70 116" stroke-width="1.6"/>
              </g>
            </g>
          </svg>
          <div class="medallion-pulse" aria-hidden="true"></div>
        </div>
        <div id="transcript"></div>
      </div>
      <!-- Discarded-notice panel: inbound messages that could not be read
           (no matching session, stale prekeys, damaged envelopes) collect here
           on the right instead of interrupting the transcript. Stays collapsed
           until the first notice; /clr empties it. Rows are app-generated text
           written via textContent - untrusted content never reaches here.

           `hidden` keeps its static labels out of the very first paint, the
           same guard the medallion uses above: the UA stylesheet's
           [hidden]{display:none} applies before style.css loads (in dev Vite
           injects the CSS via JS a frame late), which would otherwise flash
           "undelivered 0 /clr clears this list" as unstyled black-on-white
           text. Author rules outrank the UA sheet, so once style.css loads
           `#side-panel.open { display: flex }` shows it normally and the
           attribute is inert. CSP forbids an inline style. -->
      <aside id="side-panel" aria-live="polite" hidden>
        <div id="side-panel-head">
          <span id="side-panel-title">undelivered</span>
          <span id="side-panel-count">0</span>
        </div>
        <div id="side-panel-list"></div>
        <div id="side-panel-hint">/clr clears this list</div>
      </aside>
      <div id="vignette"></div>
      <div id="footer">
        <div id="divider"></div>
        <!-- The status strip is the app's one-line summary of the latest event,
             and it doubles as the announcement channel for assistive tech: it
             is a live region, so every event reaches a screen reader as a short
             sentence without having to follow the scrolling transcript.
             chrome.status() raises aria-live to "assertive" for a [SECURITY]
             event and drops it back to "polite" afterwards, so a security
             warning interrupts rather than queueing behind chatter. It carries
             only app-generated text, assigned through textContent. -->
        <div id="status-strip">
          <span
            id="status-event"
            class="status-event status-info"
            role="status"
            aria-live="polite"
            aria-atomic="true"
          ></span>
          <span id="status-context"></span>
        </div>
        <div id="autosuggest"></div>
        <div id="command-line"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
