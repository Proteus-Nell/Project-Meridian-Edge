<!-- The gaia medallion, the emblem this app wears by default
     (terminal/theme.ts::DEFAULT_EMBLEM), so the tab strip carries the same
     figure as the watermark behind the transcript.

     The path is glyph-gaia from index.html, copied verbatim: one even-odd path
     whose three open regions are holes in a single shape. The viewBox crops to
     the glyph's own bounds (x 21.2 to 118.7, y 21 to 119 in that 140 unit
     frame) rather than keeping the frame, because the ring and dashed ring
     around it there are shared framing drawn by index.html, not part of this
     glyph, and empty margin is the one thing a 16px tab strip cannot spare.

     A solid silhouette is also the easier figure to shrink. The globe this
     replaces was line art, and had to be redrawn at double stroke weight with
     its finer parallels dropped before it read at favicon size; a filled shape
     just gets smaller.

     Colour is a literal, not a CSS variable: the file is fetched standalone as
     an image, so it never sees the bundle's :root scheme slots, and cannot
     follow /settings scheme or /settings emblem the way the medallion does.
     #58a6ff is what the emblem slot resolves to under the default `dark`
     scheme (it points at that scheme's accent), and is legible against both a
     light and a dark browser chrome. No <style> element on purpose: inline CSS
     inside an SVG image sits in a murky corner of the CSP, and attributes moot
     the question. -->
